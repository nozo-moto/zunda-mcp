openapi: 3.1.0
info:
  description: VOICEVOX の音声合成エンジンです。
  title: VOICEVOX Engine
  version: 0.23.0
servers:
- url: /
paths:
  /audio_query:
    post:
      description: 音声合成用のクエリの初期値を得ます。ここで得られたクエリはそのまま音声合成に利用できます。各値の意味は`Schemas`を参照してください。
      operationId: audio_query_audio_query_post
      parameters:
      - explode: true
        in: query
        name: text
        required: true
        schema:
          title: Text
          type: string
        style: form
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioQuery'
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 音声合成用のクエリを作成する
      tags:
      - クエリ作成
  /audio_query_from_preset:
    post:
      description: 音声合成用のクエリの初期値を得ます。ここで得られたクエリはそのまま音声合成に利用できます。各値の意味は`Schemas`を参照してください。
      operationId: audio_query_from_preset_audio_query_from_preset_post
      parameters:
      - explode: true
        in: query
        name: text
        required: true
        schema:
          title: Text
          type: string
        style: form
      - explode: true
        in: query
        name: preset_id
        required: true
        schema:
          title: Preset Id
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioQuery'
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 音声合成用のクエリをプリセットを用いて作成する
      tags:
      - クエリ作成
  /accent_phrases:
    post:
      description: |-
        テキストからアクセント句を得ます。
        is_kanaが`true`のとき、テキストは次のAquesTalk 風記法で解釈されます。デフォルトは`false`です。
        * 全てのカナはカタカナで記述される
        * アクセント句は`/`または`、`で区切る。`、`で区切った場合に限り無音区間が挿入される。
        * カナの手前に`_`を入れるとそのカナは無声化される
        * アクセント位置を`'`で指定する。全てのアクセント句にはアクセント位置を1つ指定する必要がある。
        * アクセント句末に`？`(全角)を入れることにより疑問文の発音ができる。
      operationId: accent_phrases_accent_phrases_post
      parameters:
      - explode: true
        in: query
        name: text
        required: true
        schema:
          title: Text
          type: string
        style: form
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: is_kana
        required: false
        schema:
          default: false
          title: Is Kana
          type: boolean
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccentPhrase'
                type: array
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseKanaBadRequest'
          description: 読み仮名のパースに失敗
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: テキストからアクセント句を得る
      tags:
      - クエリ編集
  /mora_data:
    post:
      operationId: mora_data_mora_data_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AccentPhrase'
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccentPhrase'
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: アクセント句から音高・音素長を得る
      tags:
      - クエリ編集
  /mora_length:
    post:
      operationId: mora_length_mora_length_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AccentPhrase'
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccentPhrase'
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: アクセント句から音素長を得る
      tags:
      - クエリ編集
  /mora_pitch:
    post:
      operationId: mora_pitch_mora_pitch_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AccentPhrase'
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccentPhrase'
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: アクセント句から音高を得る
      tags:
      - クエリ編集
  /synthesis:
    post:
      operationId: synthesis_synthesis_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - description: 疑問系のテキストが与えられたら語尾を自動調整する
        explode: true
        in: query
        name: enable_interrogative_upspeak
        required: false
        schema:
          default: true
          description: 疑問系のテキストが与えられたら語尾を自動調整する
          title: Enable Interrogative Upspeak
          type: boolean
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioQuery'
        required: true
      responses:
        "200":
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 音声合成する
      tags:
      - 音声合成
  /cancellable_synthesis:
    post:
      operationId: cancellable_synthesis_cancellable_synthesis_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioQuery'
        required: true
      responses:
        "200":
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 音声合成する（キャンセル可能）
      tags:
      - 音声合成
  /multi_synthesis:
    post:
      operationId: multi_synthesis_multi_synthesis_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AudioQuery'
              type: array
        required: true
      responses:
        "200":
          content:
            application/zip:
              schema:
                format: binary
                type: string
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 複数まとめて音声合成する
      tags:
      - 音声合成
  /sing_frame_audio_query:
    post:
      description: 歌唱音声合成用のクエリの初期値を得ます。ここで得られたクエリはそのまま歌唱音声合成に利用できます。各値の意味は`Schemas`を参照してください。
      operationId: sing_frame_audio_query_sing_frame_audio_query_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Score'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameAudioQuery'
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 歌唱音声合成用のクエリを作成する
      tags:
      - クエリ作成
  /sing_frame_f0:
    post:
      operationId: sing_frame_f0_sing_frame_f0_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_sing_frame_f0_sing_frame_f0_post'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: number
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 楽譜・歌唱音声合成用のクエリからフレームごとの基本周波数を得る
      tags:
      - クエリ編集
  /sing_frame_volume:
    post:
      operationId: sing_frame_volume_sing_frame_volume_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_sing_frame_volume_sing_frame_volume_post'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: number
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 楽譜・歌唱音声合成用のクエリからフレームごとの音量を得る
      tags:
      - クエリ編集
  /frame_synthesis:
    post:
      description: 歌唱音声合成を行います。
      operationId: frame_synthesis_frame_synthesis_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameAudioQuery'
        required: true
      responses:
        "200":
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Frame Synthesis
      tags:
      - 音声合成
  /connect_waves:
    post:
      description: base64エンコードされたwavデータを一纏めにし、wavファイルで返します。
      operationId: connect_waves_connect_waves_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: true
      responses:
        "200":
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: base64エンコードされた複数のwavデータを一つに結合する
      tags:
      - その他
  /validate_kana:
    post:
      description: |-
        テキストがAquesTalk 風記法に従っているかどうかを判定します。
        従っていない場合はエラーが返ります。
      operationId: validate_kana_validate_kana_post
      parameters:
      - description: 判定する対象の文字列
        explode: true
        in: query
        name: text
        required: true
        schema:
          description: 判定する対象の文字列
          title: Text
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                title: Response Validate Kana Validate Kana Post
                type: boolean
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseKanaBadRequest'
          description: テキストが不正です
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: テキストがAquesTalk 風記法に従っているか判定する
      tags:
      - その他
  /initialize_speaker:
    post:
      description: |-
        指定されたスタイルを初期化します。
        実行しなくても他のAPIは使用できますが、初回実行時に時間がかかることがあります。
      operationId: initialize_speaker_initialize_speaker_post
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - description: 既に初期化済みのスタイルの再初期化をスキップするかどうか
        explode: true
        in: query
        name: skip_reinit
        required: false
        schema:
          default: false
          description: 既に初期化済みのスタイルの再初期化をスキップするかどうか
          title: Skip Reinit
          type: boolean
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Initialize Speaker
      tags:
      - その他
  /is_initialized_speaker:
    get:
      description: 指定されたスタイルが初期化されているかどうかを返します。
      operationId: is_initialized_speaker_is_initialized_speaker_get
      parameters:
      - explode: true
        in: query
        name: speaker
        required: true
        schema:
          title: Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                title: Response Is Initialized Speaker Is Initialized Speaker Get
                type: boolean
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Is Initialized Speaker
      tags:
      - その他
  /supported_devices:
    get:
      description: 対応デバイスの一覧を取得します。
      operationId: supported_devices_supported_devices_get
      parameters:
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedDevicesInfo'
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Supported Devices
      tags:
      - その他
  /morphable_targets:
    post:
      description: |-
        指定されたベーススタイルに対してエンジン内の各キャラクターがモーフィング機能を利用可能か返します。
        モーフィングの許可/禁止は`/speakers`の`speaker.supported_features.synthesis_morphing`に記載されています。
        プロパティが存在しない場合は、モーフィングが許可されているとみなします。
        返り値のスタイルIDはstring型なので注意。
      operationId: morphable_targets_morphable_targets_post
      parameters:
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: integer
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  additionalProperties:
                    $ref: '#/components/schemas/MorphableTargetInfo'
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 指定したスタイルに対してエンジン内のキャラクターがモーフィングが可能か判定する
      tags:
      - 音声合成
  /synthesis_morphing:
    post:
      description: |-
        指定された2種類のスタイルで音声を合成、指定した割合でモーフィングした音声を得ます。
        モーフィングの割合は`morph_rate`で指定でき、0.0でベースのスタイル、1.0でターゲットのスタイルに近づきます。
      operationId: _synthesis_morphing_synthesis_morphing_post
      parameters:
      - explode: true
        in: query
        name: base_speaker
        required: true
        schema:
          title: Base Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: target_speaker
        required: true
        schema:
          title: Target Speaker
          type: integer
        style: form
      - explode: true
        in: query
        name: morph_rate
        required: true
        schema:
          maximum: 1.0
          minimum: 0.0
          title: Morph Rate
          type: number
        style: form
      - explode: true
        in: query
        name: core_version
        required: false
        schema:
          title: Core Version
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioQuery'
        required: true
      responses:
        "200":
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 2種類のスタイルでモーフィングした音声を合成する
      tags:
      - 音声合成
  /presets:
    get:
      description: エンジンが保持しているプリセットの設定を返します
      operationId: get_presets_presets_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Preset'
                type: array
          description: プリセットのリスト
      summary: Get Presets
      tags:
      - その他
  /add_preset:
    post:
      description: 新しいプリセットを追加します
      operationId: add_preset_add_preset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preset'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                title: Response Add Preset Add Preset Post
                type: integer
          description: 追加したプリセットのプリセットID
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Preset
      tags:
      - その他
  /update_preset:
    post:
      description: 既存のプリセットを更新します
      operationId: update_preset_update_preset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preset'
        required: true
      responses:
        "200":
          content:
